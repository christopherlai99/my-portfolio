<div class="row">
  <div class="col-md-4 col-12 mt-1 d-flex" *ngFor="let item of data">
    <div class="card w-100">
      <div class="card-body">
        <h5 class="card-title">
          <div class="row p-0 m-0">
            <div class="p-0 m-0" [ngClass]="'col-9'">
              <a href="{{ item.url }}" class="card-link" target="_blank"
                >{{ item.fullname }}
              </a>
            </div>
          </div>
        </h5>
        <p class="card-text">
          {{ item.description }}
        </p>
        <app-tag-item
          *ngFor="let tag of item.tags"
          [tag]="tag"
          [spacing]="'p-1 mb-1 me-1'"
        ></app-tag-item>
      </div>
    </div>
  </div>
</div>
